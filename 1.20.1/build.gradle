plugins {
    // NOTE: for MC 1.20.1 (obfuscated) use 'fabric-loom' (the full remapping plugin).
    // 'net.fabricmc.fabric-loom' maps to LoomNoRemapGradlePlugin (unobfuscated 26.1+ mode) which disables mappings.
    id 'fabric-loom' version '1.16.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 1.20.1 uses Yarn v2 mappings (named -> intermediary)
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    // 1.20.1 requires modImplementation/modApi (not plain implementation)
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modApi "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand(["version": project.version])
    }
}

def targetJavaVersion = 17

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

// No JDK 17 is installed on this machine (JDK 21/25/26 available), so we do NOT use
// java.toolchain { languageVersion = 17 } (that would require a foojay/Adoptium download).
// options.release = 17 above already targets Java 17 bytecode, which is what MC 1.20.1 needs.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
